
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finalizar encomenda | Etsy</title>
    <link rel="stylesheet" href="encomenda.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="cabecalho">
        <a href="index.html" class="logo">Etsy<span>.</span></a>
        <a href="index.html" class="voltar">← Voltar aos produtos</a>
    </header>

    <main class="container">
        <section class="formulario">
            <span class="subtitulo">SUA ENCOMENDA</span>
            <h1>Vamos finalizar seu pedido?</h1>
            <p class="descricao">
                Preencha seus dados para solicitar sua encomenda.
            </p>

            <div class="resumo">
                <h2>Produto escolhido</h2>
                <p id="nomeProduto">Carregando produto...</p>
                <p>Preço unitário: <strong id="precoProduto"></strong></p>

                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade"
                       min="1" max="99" value="1" required>

                <p class="total">
                    Total: <strong id="valorTotal"></strong>
                </p>
            </div>

            <form id="formEncomenda">
                <h2>Seus dados</h2>

                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite seu nome completo" required>

                <div class="duas-colunas">
                    <div>
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone"
                               placeholder="(00) 00000-0000" required>
                    </div>

                    <div>
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep"
                               placeholder="00000-000" required>
                    </div>
                </div>

                <label for="rua">Rua ou avenida</label>
                <input type="text" id="rua" name="rua"
                       placeholder="Nome da rua ou avenida" required>

                <div class="duas-colunas">
                    <div>
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="numero"
                               placeholder="Nº da casa" required>
                    </div>

                    <div>
                        <label for="complemento">Complemento</label>
                        <input type="text" id="complemento" name="complemento"
                               placeholder="Casa, ap. etc.">
                    </div>
                </div>

                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro"
                       placeholder="Seu bairro" required>

                <div class="duas-colunas">
                    <div>
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade"
                               placeholder="Sua cidade" required>
                    </div>

                    <div>
                        <label for="estado">Estado</label>
                        <select id="estado" name="estado" required>
                            <option value="">Selecione</option>
                            <option value="GO">Goiás</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="SP">São Paulo</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="BA">Bahia</option>
                            <option value="TO">Tocantins</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="PR">Paraná</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="AM">Amazonas</option>
                            <option value="PA">Pará</option>
                            <option value="AC">Acre</option>
                            <option value="AP">Amapá</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="AL">Alagoas</option>
                            <option value="CE">Ceará</option>
                            <option value="MA">Maranhão</option>
                            <option value="PB">Paraíba</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="SE">Sergipe</option>
                        </select>
                    </div>
                </div>

                <label for="pagamento">Forma de pagamento</label>
                <select id="pagamento" name="pagamento" required>
                    <option value="">Selecione uma opção</option>
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>

                <label for="observacoes">Observações (opcional)</label>
                <textarea id="observacoes" name="observacoes"
                          placeholder="Alguma informação sobre sua encomenda?"
                          rows="3"></textarea>

                <button type="submit" class="botao">
                    Confirmar encomenda
                </button>

                <p id="mensagem" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Etsy — Produtos artesanais e naturais.</p>
    </footer>
</body>
</html>
